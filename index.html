<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="Private local AI chat powered by MLC WebLLM">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Pocket AI</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1>Pocket AI</h1>
      <p id="status">Local AI · WebLLM not loaded</p>
    </div>
    <button id="modelButton" class="ghost">Qwen 0.5B</button>
  </header>

  <main id="chat" class="chat" aria-live="polite">
    <section id="welcome" class="welcome">
      <div class="orb">AI</div>
      <h2>Your AI, on your device.</h2>
      <p>MLC/WebLLM runs the model directly on the device GPU. Your chat is not sent to OpenAI or another AI API.</p>
      <button id="loadButton" class="primary">Load Local AI</button>
      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress-track"><div id="progress" class="progress"></div></div>
        <span id="progressText">Preparing…</span>
      </div>
      <pre id="hardwareBox" class="hardware">Hardware check will appear here.</pre>
      <pre id="errorBox" class="error" hidden></pre>
    </section>
  </main>

  <form id="composer" class="composer">
    <textarea id="input" rows="1" placeholder="Message your AI…" disabled></textarea>
    <button id="send" class="send" type="submit" disabled aria-label="Send">↑</button>
  </form>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
