<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="A tiny private AI chat that runs locally in your browser." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Pocket AI</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>Pocket AI</h1>
          <p id="status">Local AI · not loaded</p>
        </div>
        <button id="modelButton" class="ghost">Qwen 0.5B</button>
      </header>

      <main id="chat" class="chat" aria-live="polite">
        <section id="welcome" class="welcome">
          <div class="orb">AI</div>
          <h2>Your AI, on your phone.</h2>
          <p>The model runs locally in this browser. Download it once, then it can work offline.</p>
          <button id="loadButton" class="primary">Download AI</button>
          <div id="progressWrap" class="progress-wrap" hidden>
            <div class="progress-track"><div id="progress" class="progress"></div></div>
            <span id="progressText">Preparing…</span>
          </div>
        </section>
      </main>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Message your AI…" disabled></textarea>
        <button id="send" class="send" type="submit" disabled aria-label="Send">↑</button>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
